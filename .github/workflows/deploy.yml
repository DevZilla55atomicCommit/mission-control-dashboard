name: Deploy Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest-cov coverage
      
      - name: Run lint check (ruff)
        run: |
          echo "Running ruff check for formatting and code issues..."
          ruff check backend/
      
      - name: Install test dependencies
        run: |
          pip install -e ".[dev]" 2>/dev/null || true
      
      - name: Run pytest with coverage
        run: |
          echo "Running tests on critical LLM paths only..."
          PYTHONPATH=backend COVERAGE_FILE=.coverage.coverage_coverage_report.txt pytest backend/ --cov=backend --cov-report=html --cov-report=term-missing
  
  deploy-on-merge:
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Trigger deployment pipeline
        run: |
          echo "Deployment triggered for main branch merge"
